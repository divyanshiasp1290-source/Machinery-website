    <!-- Runtime safety guard for browser DevTools soft navigation instrumentation (Chromium #543499029) -->
    <script>
      (function() {
        // 1. Guard global error events from DevTools injected VM scripts
        window.addEventListener('error', function(event) {
          var msg = event && (event.message || (event.error && event.error.message)) || '';
          var stack = (event && event.error && event.error.stack) || '';
          if (
            msg.indexOf("reading 'startTime'") !== -1 ||
            (msg.indexOf("startTime") !== -1 && (stack.indexOf('reportAllChanges') !== -1 || (event.filename && event.filename.indexOf('VM') !== -1))) ||
            stack.indexOf('reportAllChanges') !== -1 ||
            stack.indexOf('devToolsReportSoftNavs') !== -1
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        // 2. Guard window.onerror to suppress unhandled DevTools console exceptions
        var prevOnError = window.onerror;
        window.onerror = function(msg, url, line, col, err) {
          var errorStr = String(msg || '') + ' ' + (err && err.stack ? err.stack : '');
          if (
            errorStr.indexOf("reading 'startTime'") !== -1 ||
            errorStr.indexOf('reportAllChanges') !== -1 ||
            errorStr.indexOf('devToolsReportSoftNavs') !== -1
          ) {
            return true;
          }
          if (typeof prevOnError === 'function') {
            return prevOnError.apply(this, arguments);
          }
          return false;
        };

        // 3. Guard requestIdleCallback where devToolsReportSoftNavs runs (n.timeout -> reportAllChanges)
        if (typeof window.requestIdleCallback === 'function') {
          var origRequestIdleCallback = window.requestIdleCallback;
          window.requestIdleCallback = function(callback, options) {
            return origRequestIdleCallback.call(window, function(deadline) {
              try {
                return callback(deadline);
              } catch (err) {
                var errStr = String((err && err.message) || '') + ' ' + ((err && err.stack) || '');
                if (
                  errStr.indexOf("reading 'startTime'") !== -1 ||
                  errStr.indexOf('reportAllChanges') !== -1 ||
                  errStr.indexOf('devToolsReportSoftNavs') !== -1
                ) {
                  return;
                }
                throw err;
              }
            }, options);
          };
        }

        // 4. Guard PerformanceObserver from unguarded empty entries
        if (typeof window.PerformanceObserver === 'function') {
          var OrigPO = window.PerformanceObserver;
          var SafePO = function(cb) {
            var wrapped = function(entryList, obs) {
              try {
                return cb(entryList, obs);
              } catch (err) {
                var errStr = String((err && err.message) || '') + ' ' + ((err && err.stack) || '');
                if (
                  errStr.indexOf("reading 'startTime'") !== -1 ||
                  errStr.indexOf('reportAllChanges') !== -1 ||
                  errStr.indexOf('devToolsReportSoftNavs') !== -1
                ) {
                  return;
                }
                throw err;
              }
            };
            return new OrigPO(wrapped);
          };
          SafePO.prototype = OrigPO.prototype;
          SafePO.supportedEntryTypes = OrigPO.supportedEntryTypes;
          window.PerformanceObserver = SafePO;
        }
      })();
    </script>
